<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fleet Command - ศูนย์บัญชาการรถม้าเชียงใหม่</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; overflow: hidden; margin: 0; padding: 0; }
        
        /* แผนที่ปูเต็มจอเบื้องหลัง */
        #map { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; }
        
        .btn-press:active { transform: scale(0.95); }
        
        /* สไตล์หมุดรถ */
        .taxi-marker {
            background-color: #22c55e;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.9);
            transition: all 1s linear; /* 🌟 สำคัญ! ทำให้รถค่อยๆ ไหลไปหาพิกัดใหม่แบบสมูทๆ */
        }
        .taxi-marker-busy {
            background-color: #ef4444;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.9);
        }
        
        /* กล่องควบคุมที่ลอยอยู่ (Floating Panel) */
        .control-panel {
            z-index: 20;
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 -10px 25px rgba(0,0,0,0.1);
        }
        
        /* ซ่อน Scrollbar */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100">

    <!-- 🗺️ แผนที่เต็มจอ (ฉากหลัง) -->
    <div id="map"></div>

    <!-- 👑 Header แถบด้านบน (โปร่งใส) -->
    <header class="absolute top-0 left-0 w-full bg-gray-900/90 text-white p-3 flex justify-between items-center z-30 shadow-md backdrop-blur-sm">
        <div class="flex items-center gap-3">
            <span class="text-3xl animate-bounce">🚕</span>
            <div>
                <h1 class="text-lg md:text-xl font-bold text-yellow-400 leading-tight tracking-wider">FLEET COMMAND</h1>
                <p class="text-[10px] md:text-xs text-gray-300">ศูนย์บัญชาการ - เชียงใหม่</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <div class="text-right hidden sm:block">
                <p class="text-xs text-gray-300">รายได้วันนี้</p>
                <p class="text-sm md:text-base font-bold text-green-400">฿ 1,250</p>
            </div>
            <button class="bg-white/20 hover:bg-white/30 p-2 rounded-full transition-colors btn-press">
                <span class="text-xl">⚙️</span>
            </button>
        </div>
    </header>

    <!-- 🎛️ แผงควบคุมลอยตัว (Bottom Sheet บนมือถือ / Sidebar บนคอม) -->
    <div class="control-panel bottom-0 left-0 w-full h-[45vh] md:h-auto md:max-h-[80vh] md:w-96 md:top-20 md:left-4 md:rounded-2xl rounded-t-3xl flex flex-col border border-gray-200">
        
        <!-- ตัวจับลาก (สำหรับมือถือ) -->
        <div class="w-full flex justify-center py-2 md:hidden">
            <div class="w-12 h-1.5 bg-gray-300 rounded-full"></div>
        </div>

        <!-- แท็บเมนู -->
        <div class="flex border-b border-gray-200 px-2 mt-1 md:mt-3">
            <button class="flex-1 py-2 font-bold text-blue-600 border-b-2 border-blue-600 text-sm">📡 งานด่วน (2)</button>
            <button class="flex-1 py-2 font-bold text-gray-400 hover:text-gray-600 text-sm">📅 งานจอง</button>
        </div>

        <!-- 📜 รายการงาน -->
        <div class="p-3 flex-1 overflow-y-auto space-y-3 scrollbar-hide">
            
            <!-- งานที่ 1 -->
            <div class="bg-white p-3 rounded-xl shadow-sm border border-red-100 border-l-4 border-l-red-500">
                <div class="flex justify-between items-center mb-1">
                    <span class="bg-red-50 text-red-600 text-[10px] font-bold px-2 py-1 rounded-full border border-red-100 animate-pulse">🔴 VIP รอด่วน</span>
                    <span class="text-[10px] text-gray-400">2 นาทีที่แล้ว</span>
                </div>
                <h3 class="font-bold text-gray-800 text-base leading-tight mt-1">โรงแรม แชงกรี-ล่า <br><span class="text-gray-500 font-normal text-sm">➡ ไป สนามบิน</span></h3>
                <p class="text-xs text-gray-500 mt-2">👤 ผู้โดยสาร 2 ท่าน (กระเป๋า 2 ใบ)</p>
                <button class="w-full mt-3 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg text-sm transition-colors btn-press shadow-md">
                    จ่ายงานให้รถที่ใกล้สุด 🚀
                </button>
            </div>

            <!-- งานที่ 2 -->
            <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-200">
                <div class="flex justify-between items-center mb-1">
                    <span class="bg-yellow-50 text-yellow-600 text-[10px] font-bold px-2 py-1 rounded-full border border-yellow-100">🟡 คิวใหม่</span>
                    <span class="text-[10px] text-gray-400">เพิ่งเข้ามา</span>
                </div>
                <h3 class="font-bold text-gray-800 text-base leading-tight mt-1">นิมมาน ซอย 9 <br><span class="text-gray-500 font-normal text-sm">➡ ไป เซ็นทรัลเฟสฯ</span></h3>
                <p class="text-xs text-gray-500 mt-2">👤 ผู้โดยสาร 4 ท่าน (ต้องการรถใหญ่)</p>
                <button class="w-full mt-3 bg-gray-100 hover:bg-gray-200 text-blue-700 font-bold py-2 rounded-lg text-sm border border-gray-300 transition-colors btn-press">
                    เลือกคันรับงาน 🎯
                </button>
            </div>

        </div>

        <!-- สรุปรถด้านล่างสุดของกล่อง -->
        <div class="bg-gray-50 p-2 md:p-3 border-t border-gray-200 md:rounded-b-2xl">
            <div class="flex justify-between items-center text-xs">
                <span class="font-bold text-gray-600">สถานะรถในคิว:</span>
                <span class="bg-green-100 text-green-700 px-2 py-0.5 rounded font-bold">ว่าง 2 คัน</span>
            </div>
        </div>
    </div>

    <!-- คำอธิบายหมุดเล็กๆ บนขวา (ซ่อนในมือถือแนวตั้ง) -->
    <div class="absolute top-16 right-4 bg-white/90 p-2 rounded-lg shadow-md z-20 border border-gray-200 text-[10px] font-bold hidden sm:block backdrop-blur-sm">
        <div class="flex items-center gap-1 mb-1"><div class="w-3 h-3 rounded-full bg-green-500 border border-white shadow-sm"></div> รถว่าง</div>
        <div class="flex items-center gap-1"><div class="w-3 h-3 rounded-full bg-red-500 border border-white shadow-sm"></div> ติดลูกค้า</div>
    </div>

    <script>
        // ขยับศูนย์กลางแผนที่ลงมานิดนึง เพื่อไม่ให้โดนแผงควบคุมบังตรงกลางจอ
        const map = L.map('map', {zoomControl: false}).setView([18.7880, 98.9850], 14);

        // เอาปุ่ม Zoom ไปไว้ขวาล่างแทน เพื่อไม่ให้เกะกะ
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap',
            maxZoom: 19
        }).addTo(map);

        const greenIcon = L.divIcon({ className: 'taxi-marker', iconSize: [16, 16] });
        const redIcon = L.divIcon({ className: 'taxi-marker taxi-marker-busy', iconSize: [16, 16] });

        // สร้างรถและป้ายบอกชื่อ (Popup เด้งอัตโนมัติให้ดูอลังการ)
        const car1 = L.marker([18.7880, 98.9930], {icon: greenIcon}).addTo(map).bindPopup("<b>พี่โหน่ง (รถตู้)</b><br>สถานะ: 🟢 ว่าง").openPopup();
        const car2 = L.marker([18.7950, 98.9800], {icon: redIcon}).addTo(map).bindPopup("<b>น้าชัย (เก๋ง)</b><br>สถานะ: 🔴 กำลังส่งลูกค้า");
        const car3 = L.marker([18.7750, 98.9850], {icon: greenIcon}).addTo(map).bindPopup("<b>ไอ้เติ้ล (SUV)</b><br>สถานะ: 🟢 ว่าง");

        // เส้นทางรถ (Waypoint) - กำหนดจุดให้รถวิ่งตามถนนจริงๆ
        const pathCar1 = [[18.7880, 98.9930], [18.7930, 98.9930], [18.7930, 98.9930], [18.7880, 98.9930]];
        const pathCar2 = [[18.7950, 98.9680], [18.7990, 98.9680], [18.8020, 98.9720], [18.7990, 98.9680]];
        const pathCar3 = [[18.7650, 98.9750], [18.7700, 98.9750], [18.7750, 98.9800], [18.7700, 98.9750]];

        // 🌟 ฟังก์ชันขับรถ (อัปเกรดให้วิ่งสมูทขึ้น) 🌟
        function animateCar(marker, pathArray, speed) {
            let currentWaypoint = 0;
            let currentPos = [...pathArray[0]];
            
            setInterval(() => {
                let targetPos = pathArray[currentWaypoint];
                let dx = targetPos[0] - currentPos[0];
                let dy = targetPos[1] - currentPos[1];
                let distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < speed) {
                    currentPos = [...targetPos];
                    currentWaypoint = (currentWaypoint + 1) % pathArray.length;
                } else {
                    currentPos[0] += (dx / distance) * speed;
                    currentPos[1] += (dy / distance) * speed;
                }
                
                // การผสม CSS transition: all 1s linear เข้าไป จะทำให้หมุดค่อยๆ เลื่อนอย่างนุ่มนวล
                marker.setLatLng(currentPos);
            }, 1000); 
        }

        animateCar(car1, pathCar1, 0.0003); 
        animateCar(car2, pathCar2, 0.0006); 
        animateCar(car3, pathCar3, 0.0004); 
        
    </script>
</body>
</html>
